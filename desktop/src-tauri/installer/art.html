<!doctype html>
<!-- Source of the installer pictures: sidebar.bmp is a 164x314 screenshot
     of #side, header.bmp a 150x57 one of #head, both saved as 24-bit BMP
     (see desktop/README.md). -->
<html lang="ru"><head><meta charset="utf-8"><title>Картинки установщика</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{background:#333;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
.tile{display:inline-flex;align-items:center;justify-content:center;background:#e3a93b;color:#121212}
.word{font-weight:600;color:#ededeb;letter-spacing:-0.01em}
.word span{font-weight:400;color:#a9acb2}
#side{position:relative;width:164px;height:314px;background:#0b0c0d;border-right:1px solid #26282c;overflow:hidden}
#side .brand{position:absolute;left:18px;top:22px}
#side .tile{width:34px;height:34px;border-radius:7px}
#side .word{margin-top:14px;font-size:20px;line-height:1}
#side .sub{margin-top:8px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#80848c}
#side .bars{position:absolute;left:18px;right:18px;bottom:44px;height:92px;display:flex;align-items:flex-end;gap:5px}
#side .bars i{flex:1;border-radius:2px 2px 0 0;background:#e3a93b}
#side .base{position:absolute;left:18px;right:18px;bottom:43px;height:1px;background:#26282c}
#side .url{position:absolute;left:18px;bottom:20px;font:500 9.5px "IBM Plex Mono",monospace;color:#80848c;letter-spacing:.02em}
#head{width:150px;height:57px;background:#0e0f10;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:12px}
#head .tile{width:26px;height:26px;border-radius:6px}
#head .word{font-size:15px}
</style></head><body>
<div id="side">
  <div class="brand">
    <span class="tile"><svg viewBox="0 0 32 32" width="24" height="24"><path d="M6 6V12.5M11 10V18M16 15V26M21 10V18M26 6V12.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span>
    <div class="word">VEIN<span>Music</span></div>
    <div class="sub">для Windows</div>
  </div>
  <div class="bars" id="bars"></div>
  <div class="base"></div>
  <div class="url">music.vein.guru</div>
</div>
<br>
<div id="head">
  <span class="tile"><svg viewBox="0 0 32 32" width="18" height="18"><path d="M6 6V12.5M11 10V18M16 15V26M21 10V18M26 6V12.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></span>
  <span class="word">VEIN<span>Music</span></span>
</div>
<script>
const h=[34,52,41,70,58,88,64,47,76,55,38];
const box=document.getElementById("bars");
h.forEach((v,i)=>{const b=document.createElement("i");b.style.height=v+"%";b.style.opacity=(0.18+0.07*i).toFixed(2);box.append(b);});
</script>
</body></html>
