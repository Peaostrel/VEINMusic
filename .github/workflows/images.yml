name: Docker images

# Builds the backend and frontend images and publishes them to GitHub
# Container Registry for deploy/docker-compose.yml. The server only pulls
# them: a 1 GB VPS cannot run `next build` itself.
on:
  push:
    branches:
      - VEIN
  workflow_dispatch:
  pull_request:
    branches: [VEIN]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend.Dockerfile
          - name: frontend
            dockerfile: frontend.Dockerfile
    env:
      IMAGE: ghcr.io/peaostrel/veinmusic-${{ matrix.name }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      # Baked into the frontend bundle; override with repository variables
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.music.vein.guru' }}
      PUBLIC_WS_HOST: ${{ vars.PUBLIC_WS_HOST || 'api.music.vein.guru' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build images (publish on VEIN)
        run: |
          # Use the runner's built-in BuildKit. A container driver would first
          # pull moby/buildkit from Docker Hub, before any Dockerfile executes.
          output=(--load)
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then output=(--push); fi
          docker buildx build \
            --file "$DOCKERFILE" \
            --build-arg "NEXT_PUBLIC_API_URL=$PUBLIC_API_URL" \
            --build-arg "NEXT_PUBLIC_WS_URL=$PUBLIC_WS_HOST" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "${output[@]}" \
            .
