name: Docker images

# Builds the backend and frontend images and publishes them to GitHub
# Container Registry for deploy/docker-compose.yml. The server only pulls
# them: a 1 GB VPS cannot run `next build` itself.
on:
  push:
    branches:
      - VEIN
  workflow_dispatch:
  pull_request:
    branches: [VEIN]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend.Dockerfile
            base_image_tag: python:3.11-slim
          - name: frontend
            dockerfile: frontend.Dockerfile
            base_image_tag: node:20-alpine
    env:
      IMAGE: ghcr.io/peaostrel/veinmusic-${{ matrix.name }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      BASE_IMAGE_TAG: ${{ matrix.base_image_tag }}
      # Baked into the frontend bundle; override with repository variables
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.music.vein.guru' }}
      PUBLIC_WS_HOST: ${{ vars.PUBLIC_WS_HOST || 'api.music.vein.guru' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify registry recovery
        run: |
          bash -n .github/scripts/build_image.sh
          python3 .github/scripts/test_build_image.py

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build images (publish on VEIN)
        run: bash .github/scripts/build_image.sh
