name: CI/CD Pipeline

on:
  push:
    branches:
      - VEIN
      - main
  pull_request:
    branches:
      - VEIN
      - main

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff flake8 httpx

      - name: Run Ruff Check
        run: ruff check app

      - name: Run Flake8 Check
        run: flake8 app

      - name: Run Pytest
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          REDIS_URL: 'redis://localhost:6379'
        run: python -m pytest tests/

  frontend-build:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run Type Check (TypeScript)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js App
        working-directory: frontend
        run: npm run build
