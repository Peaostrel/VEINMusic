name: CI/CD Pipeline

on:
  push:
    branches:
      - VEIN
      - main
  pull_request:
    branches:
      - VEIN
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip # NOSONAR
          pip install --only-binary :all: -r requirements.txt # NOSONAR
          pip install --only-binary :all: pytest==8.2.0 ruff==0.4.4 flake8==7.0.0 httpx==0.27.0 bandit==1.7.8 mypy==1.10.0 pytest-cov==5.0.0

      - name: Run Ruff Check
        run: ruff check app

      - name: Run Flake8 Check
        run: flake8 app

      - name: Run Pytest
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          REDIS_URL: 'redis://localhost:6379'
        run: python -m pytest --cov=app --cov-report=xml tests/

      - name: Run Bandit (Security Check)
        run: bandit -r app/ -ll -ii

      - name: Run Mypy (Type Check)
        run: mypy app/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  frontend-build:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run Linter (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run Prettier (Format Check)
        working-directory: frontend
        run: npm run format:check

      - name: Run Type Check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: Build Next.js App
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip # NOSONAR
          pip install --only-binary :all: -r requirements.txt # NOSONAR
          pip install --only-binary :all: uvicorn==0.29.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start Backend Server
        env:
          DATABASE_URL: 'sqlite:///./e2e_test.db'
          REDIS_URL: 'redis://localhost:6379'
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 5 # Wait for backend to start

      - name: Start Frontend Server & Run Playwright
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:8000'
        run: |
          nohup npm run dev &
          while ! curl -s http://127.0.0.1:3000 > /dev/null; do sleep 1; done
          npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Backend Logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-backend-logs
          path: backend.log
          retention-days: 7
