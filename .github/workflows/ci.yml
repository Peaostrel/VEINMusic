name: CI/CD Pipeline

on:
  push:
    branches:
      - VEIN
      - main
  pull_request:
    branches:
      - VEIN
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway database reachable only from this job: no password
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: veinmusic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          bash .github/scripts/install_deps.sh
          pip install --only-binary :all: pytest==8.2.0 ruff==0.4.4 flake8==7.0.0 httpx==0.27.0 bandit==1.7.8 mypy==1.10.0 pytest-cov==5.0.0

      - name: Run Ruff Check
        run: ruff check app

      - name: Run Flake8 Check
        run: flake8 app

      - name: Run Pytest (SQLite)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          REDIS_URL: 'redis://localhost:6379'
          TEST_REDIS_URL: 'redis://localhost:6379'
        run: python -m pytest --cov=app --cov-report=xml tests/

      - name: Run Pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: 'postgresql://postgres@localhost:5432/veinmusic_test'
          TEST_REDIS_URL: 'redis://localhost:6379'
        run: python -m pytest -q tests/

      - name: Check Alembic Migrations (PostgreSQL)
        env:
          DATABASE_URL: 'postgresql://postgres@localhost:5432/veinmusic_migrations'
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE veinmusic_migrations'
          python -m app.core.migrate
          # Fails if the models and the migrations have drifted apart
          alembic check

      - name: Run Bandit (Security Check)
        run: bandit -r app/ -ll -ii

      - name: Run Mypy (Type Check)
        run: mypy app/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  # CI-based SonarQube Cloud analysis with coverage. Automatic Analysis
  # can't import coverage reports, so this runs only after it was switched
  # off in SonarQube Cloud and the repository variable SONAR_CI_ANALYSIS is
  # set to "true" (plus the SONAR_TOKEN secret).
  sonarcloud:
    name: SonarQube Cloud (with coverage)
    runs-on: ubuntu-latest
    needs: backend-test
    if: ${{ vars.SONAR_CI_ANALYSIS == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v7
        with:
          name: backend-coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-build:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run Linter (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run Prettier (Format Check)
        working-directory: frontend
        run: npm run format:check

      - name: Run Type Check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: Build Next.js App
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          bash .github/scripts/install_deps.sh
          pip install --only-binary :all: uvicorn==0.29.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start Backend Server
        env:
          DATABASE_URL: 'sqlite:///./e2e_test.db'
          REDIS_URL: 'redis://localhost:6379'
          # Every test signs up a fresh account from the same IP
          REGISTER_RATE_LIMIT: '1000/minute'
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 5 # Wait for backend to start

      - name: Start Frontend Server & Run Playwright
        working-directory: frontend
        env:
          # Same site as the frontend (localhost), otherwise the browser drops
          # the SameSite=Strict session cookie and no test is signed in
          NEXT_PUBLIC_API_URL: 'http://localhost:8000'
          # The admin spec grants the role with `python -m app.cli`
          E2E_DATABASE_URL: 'sqlite:///./e2e_test.db'
        run: |
          nohup npm run dev &
          while ! curl -s http://127.0.0.1:3000 > /dev/null; do sleep 1; done
          npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Backend Logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-backend-logs
          path: backend.log
          retention-days: 7
