name: Desktop app (Windows)

# Builds the VEINMusic for Windows installer (desktop/). A tag desktop-vX.Y.Z
# publishes it as a GitHub release; the app checks those releases for updates.
on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "desktop-v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${app_version} in tauri.conf.json"
            exit 1
          fi

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build installer
        env:
          # Discord application for the "listening" status (optional)
          VEIN_DISCORD_CLIENT_ID: ${{ vars.VEIN_DISCORD_CLIENT_ID }}
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: VEINMusic-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: VEINMusic-windows
          path: installer

      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # The release was created by hand on GitHub: add the installer to it
            gh release upload "${GITHUB_REF_NAME}" installer/*.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" installer/*.exe \
              --title "VEINMusic для Windows ${version}" \
              --notes "Установщик VEINMusic для Windows ${version}. Скачайте .exe ниже и запустите: приложение встанет в меню «Пуск» и в трей."
          fi
