# Shared configuration of the API and the background worker
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-veinmusic}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@music.vein.guru}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
  LASTFM_API_KEY: ${LASTFM_API_KEY:-}
  LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
  SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
  SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
  SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8000/auth/spotify/callback}

services:
  db:
    image: postgres:15-alpine
    container_name: veinmusic-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No insecure default: set POSTGRES_PASSWORD in .env (the postgres
      # image refuses to initialize without it)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-veinmusic}
    # Only reachable from the host itself (and the compose network)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: veinmusic-redis
    restart: always
    # Password-protected and bound to localhost: arq stores pickled jobs in
    # Redis, so an exposed Redis would allow code execution on the worker.
    # Refuses to start without REDIS_PASSWORD (set it in .env).
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" || { echo "REDIS_PASSWORD is required" >&2; exit 1; }; exec redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: veinmusic-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      # The API applies Alembic migrations on start (see docker-entrypoint.sh)
      RUN_MIGRATIONS: "1"
      # Spotify/Yandex polling runs in the worker (arq cron job)
      RUN_CLOUD_POLLING: "0"
      # IPs of the reverse proxy allowed to set X-Forwarded-For (for correct
      # client IPs in rate limiting). Use the proxy's address, not "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Executes background jobs queued in Redis (achievements, webhooks,
  # Last.fm/ListenBrainz exports, Last.fm history import)
  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: veinmusic-worker
    restart: always
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/app/uploads
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-localhost:8000}
    container_name: veinmusic-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:
