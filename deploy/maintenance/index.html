<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Идёт обновление — VEINMusic</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #0e0f11; color: #ececee;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      max-width: 380px; padding: 40px 32px; text-align: center;
      background: #16171a; border: 1px solid #26282c; border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
    }
    .tile {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 11px; background: #e3a93b; color: #121212;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    p { margin: 0; font-size: 14px; line-height: 1.6; color: #a3a5ab; }
    .brand { font-size: 13px; color: #6c6f76; }
    .brand b { color: #ececee; font-weight: 600; }
    .beta {
      display: inline-block; margin-left: 4px; padding: 1px 6px; border: 1px solid rgba(227, 169, 59, .5);
      border-radius: 999px; font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: .06em;
      color: #e3a93b; vertical-align: 1px;
    }
    .dots { display: flex; gap: 6px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%; background: #e3a93b;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="tile" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="34" height="34">
        <path d="M6 6V12.5M11 10V18M16 15V26M21 10V18M26 6V12.5" fill="none" stroke="currentColor"
              stroke-width="3.2" stroke-linecap="round"/>
      </svg>
    </span>
    <h1>Идёт обновление</h1>
    <p>Мы выкатываем новую версию VEINMusic. Пожалуйста, подождите — это займёт около минуты, страница обновится сама.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand"><b>VEIN</b>Music<span class="beta">BETA</span></div>
  </main>
  <script>
    // The server marks this page with X-Maintenance; once the real site
    // answers again, reload it
    setInterval(function () {
      fetch(location.href, { cache: "no-store" }).then(function (res) {
        if (res.ok && res.headers.get("X-Maintenance") !== "1") location.reload();
      }).catch(function () {});
    }, 5000);
  </script>
</body>
</html>
