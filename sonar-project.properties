# Used by the CI-based analysis (see the "sonarcloud" job in
# .github/workflows/ci.yml). Check that the organization matches SonarQube Cloud.
sonar.projectKey=Peaostrel_VEINMusic
sonar.organization=peaostrel

sonar.sources=app,frontend/app,frontend/components,frontend/utils,music-extension,desktop_client
sonar.tests=tests,frontend/e2e
sonar.exclusions=**/node_modules/**,frontend/.next/**,alembic/versions/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
