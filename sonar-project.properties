# Used by the CI-based analysis (see the "sonarcloud" job in
# .github/workflows/ci.yml). Check that the organization matches SonarQube Cloud.
sonar.projectKey=Peaostrel_VEINMusic
sonar.organization=peaostrel

sonar.sources=app,frontend/app,frontend/components,frontend/utils,music-extension,desktop_client
sonar.tests=tests,frontend/e2e,music-extension/tests
sonar.exclusions=**/node_modules/**,frontend/.next/**,alembic/versions/**,music-extension/tests/**
# Legal pages are content documents; repeated section structure is intentional
# and should not count as duplicated application code.
sonar.cpd.exclusions=frontend/app/privacy/page.tsx,frontend/app/terms/page.tsx
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
