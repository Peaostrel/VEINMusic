<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VEIN Tracker</title>
    <style>
        body { width: 260px; padding: 16px; background: #121212; color: white; font-family: system-ui, sans-serif; margin: 0; text-align: center; }
        h3 { margin-top: 0; color: #ffcc00; font-weight: 900; letter-spacing: 1px; }
        .box { background: #1a1a1a; padding: 12px; border: 1px solid #333; border-radius: 8px; margin-top: 10px; }
        .error { color: #ef4444; font-size: 13px; font-weight: bold; }
        .success { color: #1DB954; font-size: 13px; font-weight: bold; }
        .username { color: white; font-size: 16px; font-weight: 900; margin: 5px 0; }
    </style>
</head>
<body>
    <h3>VEIN TRACKER</h3>
    
    <div id="unauth-box" class="box">
        <div style="font-size: 11px; color: #888; margin-bottom: 8px;">Вставь API ключ со страницы настроек VEIN:</div>
        <input type="text" id="api-key-input" aria-label="API Ключ" placeholder="API Ключ" style="width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 5px; background: #222; color: white; border: 1px solid #444;" />
        <input type="text" id="username-input" aria-label="Твой никнейм" placeholder="Твой никнейм" style="width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 5px; background: #222; color: white; border: 1px solid #444;" />
        <button id="save-btn" style="width: 100%; padding: 6px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; color: black; border-radius: 4px;">Сохранить</button>
    </div>

    <div id="auth-box" class="box" style="display: none;">
        <div class="success">Подключено</div>
        <div style="font-weight: bold; margin-top: 5px; color: #fff;">@<span id="username-display"></span></div>
        <div style="font-size: 10px; color: #888; margin-top: 5px;">Скробблер работает в фоновом режиме.</div>
        <button id="test-btn" style="width: 100%; padding: 6px; margin-top: 10px; background: #333; color: white; border: 1px solid #555; cursor: pointer; border-radius: 4px;">Тест связи</button>
        <div id="log-box" style="margin-top: 10px; font-size: 10px; color: #ffcc00; word-break: break-all;"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
