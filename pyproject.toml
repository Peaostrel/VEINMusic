[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",    # Do not perform function call in argument defaults (fastapi.Depends)
    "BLE001",  # Do not catch blind exception: Exception (Intentional for worker loops)
    "S110",    # try-except-pass detected (Intentional fallback behaviour)
]
